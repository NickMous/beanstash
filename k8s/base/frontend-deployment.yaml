apiVersion: apps/v1
kind: Deployment
metadata:
  name: beanstash-frontend
  labels:
    app.kubernetes.io/name: beanstash-frontend
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: beanstash-frontend
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: beanstash-frontend
        app.kubernetes.io/component: frontend
    spec:
      imagePullSecrets:
        - name: ghcr-login-secret
      initContainers:
        - name: wait-for-api
          image: busybox
          command:
            - sh
            - -c
            - |
              until wget -q --spider "${APP_SERVICE_HOST}" 2>/dev/null; do
                echo "Waiting for API..."
                sleep 5
              done
              echo "API is ready!"
          env:
            - name: APP_SERVICE_HOST
              valueFrom:
                configMapKeyRef:
                  name: beanstash-config
                  key: NEXT_PUBLIC_API_URL
      containers:
        - name: frontend
          image: beanstash-frontend
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: beanstash-config
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
