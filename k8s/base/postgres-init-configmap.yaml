apiVersion: v1
kind: ConfigMap
metadata:
  name: beanstash-postgres-init
  labels:
    app.kubernetes.io/name: beanstash-postgres
    app.kubernetes.io/component: database
data:
  # Mirror of backend/db/init.sh (used by docker-compose) — keep the two in sync.
  # Mounted at /docker-entrypoint-initdb.d/; the postgres entrypoint runs it once,
  # on first cluster initialisation (empty PGDATA), before Flyway migrations.
  # Creates the least-privilege role the backend connects as. APP_USER / APP_PASSWORD
  # are injected from the datasource credentials in postgres.yaml.
  init.sh: |
    #!/bin/bash
    psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" <<-EOSQL
        CREATE USER "$APP_USER" WITH PASSWORD '$APP_PASSWORD';
        GRANT CONNECT ON DATABASE "$POSTGRES_DB" TO "$APP_USER";
        GRANT USAGE ON SCHEMA public TO "$APP_USER";
        ALTER DEFAULT PRIVILEGES IN SCHEMA public
          GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO "$APP_USER";
    EOSQL
