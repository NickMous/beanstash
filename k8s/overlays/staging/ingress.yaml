apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: beanstash-staging-frontend-http
  labels:
    app.kubernetes.io/name: beanstash
    app.kubernetes.io/component: ingress
spec:
  entryPoints:
    - web
  routes:
    # ACME challenge route - no redirect (higher priority)
    - match: Host(`staging.beanstash.org`) && PathPrefix(`/.well-known/acme-challenge`)
      kind: Rule
      priority: 100
      services:
        - name: beanstash-frontend-service
          port: 80
    # All other HTTP requests - redirect to HTTPS
    - match: Host(`staging.beanstash.org`)
      kind: Rule
      priority: 10
      services:
        - name: beanstash-frontend-service
          port: 80
      middlewares:
        - name: redirect-to-https
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: beanstash-staging-frontend-https
  labels:
    app.kubernetes.io/name: beanstash
    app.kubernetes.io/component: ingress
spec:
  entryPoints:
    - websecure
  routes:
    # Bypass basic auth from an allowlisted IP, or with the shared unlock cookie.
    # Set the cookie once on .staging.beanstash.org and it carries to every branch subdomain.
    - match: Host(`staging.beanstash.org`) && (ClientIP(`83.82.205.21/32`) || ClientIP(`2001:1c02:1e04:5700::/64`) || ClientIP(`10.8.0.0/24`) || HeaderRegexp(`Cookie`, `(^|;\s?)stg_unlock=f3306f547eb2ed9a09f871b5f06ff9519b381e05b23ebbdc(;|$)`))
      kind: Rule
      priority: 20
      services:
        - name: beanstash-frontend-service
          port: 80
    # Everyone else: basic auth
    - match: Host(`staging.beanstash.org`)
      kind: Rule
      priority: 10
      services:
        - name: beanstash-frontend-service
          port: 80
      middlewares:
        - name: staging-basic-auth
  tls:
    secretName: beanstash-staging-tls
    options:
      name: staging-tls-options
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: beanstash-staging-backend-http
  labels:
    app.kubernetes.io/name: beanstash
    app.kubernetes.io/component: ingress
spec:
  entryPoints:
    - web
  routes:
    # ACME challenge route - no redirect (higher priority)
    - match: Host(`staging.api.beanstash.org`) && PathPrefix(`/.well-known/acme-challenge`)
      kind: Rule
      priority: 100
      services:
        - name: beanstash-backend-service
          port: 80
    # All other HTTP requests - redirect to HTTPS
    - match: Host(`staging.api.beanstash.org`)
      kind: Rule
      priority: 10
      services:
        - name: beanstash-backend-service
          port: 80
      middlewares:
        - name: redirect-to-https
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: beanstash-staging-backend-https
  labels:
    app.kubernetes.io/name: beanstash
    app.kubernetes.io/component: ingress
spec:
  entryPoints:
    - websecure
  routes:
    # No basic auth: a browser can't authenticate a CORS preflight, which would
    # break every cross-origin call from the SPA. The API is gated by Spring Security.
    - match: Host(`staging.api.beanstash.org`)
      kind: Rule
      services:
        - name: beanstash-backend-service
          port: 80
  tls:
    secretName: beanstash-staging-tls
    options:
      name: staging-tls-options
---
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: staging-tls-options
spec:
  minVersion: VersionTLS12
  maxVersion: VersionTLS13
  cipherSuites:
    - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
    - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
    - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
    - TLS_AES_128_GCM_SHA256
    - TLS_AES_256_GCM_SHA384
    - TLS_CHACHA20_POLY1305_SHA256
