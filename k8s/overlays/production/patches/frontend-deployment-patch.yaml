# Production frontend deployment patches
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beanstash-frontend
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: frontend
          # A fresh pod uses ~100-170Mi and grows to ~260Mi over two weeks;
          # the limit caps that growth with a restart.
          resources:
            requests:
              memory: "192Mi"
              cpu: "50m"
            limits:
              memory: "384Mi"
