# Production backend deployment patches
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beanstash-backend
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: backend
          # A running pod uses ~10-20m; 100m keeps the HPA's 70% CPU target
          # meaningful. No CPU limit, so JVM startup can burst.
          resources:
            requests:
              memory: "608Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
