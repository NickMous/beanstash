# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # The root pom is an aggregator; Dependabot follows <modules>, so this
  # single entry covers the root, backend, and frontend poms.
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # One PR for all minor/patch bumps; majors still get their own PR.
      maven-minor-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "bun"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      bun-minor-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      # Actions bump rarely; one PR for everything, majors included.
      github-actions:
        patterns:
          - "*"
