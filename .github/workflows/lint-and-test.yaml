name: Lint and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Compile and lint
        run: mvn compile --batch-mode

      # `mvn compile` regenerates frontend/generated from backend/openapi.json.
      # The client stays committed because the frontend image is built without a
      # JDK, so this is what stops it drifting from the spec.
      - name: Check generated API client is up to date
        run: |
          if [ -n "$(git status --porcelain -- frontend/generated)" ]; then
            echo "::error::frontend/generated is stale. Run 'mvn compile' and commit the result."
            git diff -- frontend/generated
            exit 1
          fi

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Run unit tests
        run: mvn test --batch-mode

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    permissions:
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Run unit and integration tests
        run: mvn verify --batch-mode

      - name: Print code coverage
        run: |
          awk -F',' 'NR>1 { missed += $4; covered += $5 } END { total = missed + covered; printf "Line coverage: %.2f%% (%d/%d)\n", (total > 0 ? covered/total*100 : 0), covered, total }' backend/target/site/jacoco/jacoco.csv

      - name: Add coverage to PR comment
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.8.0
        with:
          paths: backend/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 80
          min-coverage-changed-files: 80
          title: Code Coverage Report

  e2e-tests:
    runs-on: ubuntu-latest
    needs: integration-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Run e2e tests
        run: mvn verify --batch-mode -Pe2e -Dsurefire.skip=true
