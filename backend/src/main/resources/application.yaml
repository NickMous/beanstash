---
spring:
  application:
    name: beanstash-backend
  docker:
    compose:
      enabled: false
      file: ./backend/docker-compose.yaml
  flyway:
    placeholders:
      app_user: ${SPRING_DATASOURCE_USERNAME}
      app_password: ${SPRING_DATASOURCE_PASSWORD}
app:
  # Front-end origin. Used as the CORS allowed origin and the WebAuthn allowed origin.
  # In production set this to the SPA origin, e.g. https://beanstash.org (not the API host).
  url: http://localhost:3000
  rp-id: localhost
